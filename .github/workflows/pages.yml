name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'install.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued rather than cancelled, so a rapid pair of
# pushes still ends with the newer content live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          # install.sh is copied from the repository root rather than kept as a
          # second copy under site/. The command on the home page pipes this
          # file into a shell, so it must be the same script that is in the
          # repository people are invited to read — two copies would eventually
          # drift, and the drift would be invisible.
          cp install.sh site/install.sh
          chmod 0644 site/install.sh

      - name: Check the published script is the repository's
        run: |
          diff -q install.sh site/install.sh
          echo "install.sh matches the repository copy"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
