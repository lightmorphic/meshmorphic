name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Build for each platform
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            for cmd in mm-agent mm-gateway mm-edge; do
              GOOS=$os GOARCH=$arch go build \
                -trimpath -ldflags="-s -w -buildid=" \
                -o "dist/${cmd}-${os}-${arch}" "./cmd/${cmd}"
            done
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Attestation lets anyone verify that a downloaded binary was built by
      # this workflow from this commit. Given the installer asks people to run
      # this on their own machine, being able to check that matters.
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Verify a download against the published checksums:

                sha256sum -c SHA256SUMS --ignore-missing

            Builds are reproducible: building this tag from source with
            `make build` produces byte-identical binaries.

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
