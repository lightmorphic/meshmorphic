{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — MeshMorphic</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <span class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="4" r="2.4" fill="currentColor"/>
        <circle cx="4.5" cy="17" r="2.4" fill="currentColor"/>
        <circle cx="19.5" cy="17" r="2.4" fill="currentColor"/>
        <path d="M12 6.4 5.6 15M12 6.4 18.4 15M6.9 17h10.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      MeshMorphic
    </span>
    <nav class="tabs">
      <a href="/"{{if eq .Title "Your website"}} aria-current="page"{{end}}>Overview</a>
      <a href="/site"{{if eq .Title "Your website files"}} aria-current="page"{{end}}>Files</a>
      <a href="/domains"{{if eq .Title "Your own domain"}} aria-current="page"{{end}}>Domain</a>
      <a href="/recovery"{{if eq .Title "Recovery key"}} aria-current="page"{{end}}>Recovery</a>
      <a href="/devices"{{if eq .Title "Devices"}} aria-current="page"{{end}}>Devices</a>
    </nav>
  </header>
{{end}}

{{define "foot"}}
  <footer class="foot">MeshMorphic — this page is served from your own computer and is not reachable from the internet.</footer>
</div>
</body>
</html>
{{end}}

{{define "error"}}{{if .}}<div class="notice err" role="alert">! {{.}}</div>{{end}}{{end}}
