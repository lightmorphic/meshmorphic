# The website container's server.
#
# It serves static files and does nothing else. No proxying, no scripting, no
# outbound anything — there is nowhere for it to go even if it tried.

server {
    # Above 1024, so the container needs no capability to bind it and can run
    # with every capability dropped.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The agent in front of this holds the real hostname and the TLS session.
    # This container never needs to know either.
    absolute_redirect off;

    # Do not advertise the version to anybody probing.
    server_tokens off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # A friendly page when a site has been installed but has no index file.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        return 404 "Not found.\n";
        add_header Content-Type text/plain always;
    }

    # Static sites benefit from caching; HTML is left uncached so that
    # replacing the site in the panel takes effect immediately.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
    }

    # Hidden files are never part of a website and are frequently a mistake
    # somebody made while zipping a folder.
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
